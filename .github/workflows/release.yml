name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [dist/**]

permissions:
  contents: read # for checkout

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
    steps:
      # setup github auth with bot
      - name: github auth
        id: bot
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4 (2025-09-13)
        with:
          app-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_APP_PEM_FILE }}
          # Least privilege. Without an explicit `permission-*` input the token
          # inherits every permission the installation holds, which zizmor
          # flags High. The release only cuts tags and a GitHub Release, and
          # the semantic-release GitHub plugin has both comment conditions
          # turned off, so it never needs issues or pull-requests.
          permission-contents: write

      # A `uses: ./…` composite can only resolve once something is on disk, so
      # the first step shallow-fetches the workspace by hand. Same shape as
      # ci.yml's bootstrap: no third-party checkout action, the token
      # authorizes the fetch inline and is never written to .git/config.
      - name: bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD

      # Fleet composite: checkout + node + pnpm + install. pnpm is required
      # because package.json declares deps with the `catalog:` protocol, which
      # npm cannot resolve. fetch-depth 0 because semantic-release reads the
      # full tag history to pick the next version.
      - name: checkout, setup and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          checkout-fetch-depth: '0'

      - name: release
        env:
          GIT_AUTHOR_NAME: socket-release-bot[bot]
          GIT_AUTHOR_EMAIL: 234652667+socket-release-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: socket-release-bot[bot]
          GIT_COMMITTER_EMAIL: 234652667+socket-release-bot[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
        run: pnpm exec semantic-release
