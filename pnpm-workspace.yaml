  # Repo-specific overrides below.
  # `@actions/github` asks for `@actions/http-client@^3.0.2` while
  # `@actions/core` and `@actions/tool-cache` ask for `^4.0.0`, so the tree
  # carries two majors of a package this repo bundles. The two majors differ
  # only in packaging — both are ESM and both depend on `undici@^6.23.0` —
  # so collapsing onto 4.0.1 keeps one copy in the bundle.
  '@actions/http-client': '4.0.1'
  # Redirect the upstream package to the hardened Socket drop-in, same as the
  # fleet-canonical `@socketregistry/*` redirects above.
  'packageurl-js': 'npm:@socketregistry/packageurl-js@1.5.2'
  # `@actions/http-client` (reached via every `@actions/*` dep) asks for
  # `undici@^5.25.4`, and no undici 5.x release carries a provenance
  # attestation while later-published 6.x/7.x/8.x releases do. pnpm's
  # `trustPolicy: no-downgrade` compares by publish DATE across the whole
  # package, so any 5.x resolves as a trust downgrade and the install fails.
  # 6.28.0 is the version the rest of the fleet pins and keeps the
  # ProxyAgent/Agent/fetch surface `@actions/http-client` uses.
  'undici': '6.28.0'

