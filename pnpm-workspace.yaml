  # Repo-specific overrides below.
  # `@actions/github` asks for `@actions/http-client@^3.0.2` while
  # `@actions/core` and `@actions/tool-cache` ask for `^4.0.0`, so the tree
  # carries two majors of a package this repo bundles. The two majors differ
  # only in packaging — both are ESM and both depend on `undici@^6.23.0` —
  # so collapsing onto 4.0.1 keeps one copy in the bundle.
  '@actions/http-client': '4.0.1'
  # Redirect the upstream package to the hardened Socket drop-in, same as the
  # fleet-canonical `@socketregistry/*` redirects above.
  'packageurl-js': 'npm:@socketregistry/packageurl-js@1.5.0'
  # `@actions/http-client` (reached via every `@actions/*` dep) asks for
  # `undici@^5.25.4`, and no undici 5.x release carries a provenance
  # attestation while later-published 6.x/7.x/8.x releases do. pnpm's
  # `trustPolicy: no-downgrade` compares by publish DATE across the whole
  # package, so any 5.x resolves as a trust downgrade and the install fails.
  # 6.28.0 is the version the rest of the fleet pins and keeps the
  # ProxyAgent/Agent/fetch surface `@actions/http-client` uses.
  'undici': '6.28.0'

packages:
  - .claude/hooks/fleet/*
  - .config/fleet/oxlint-plugin
  - .config/fleet/oxlint-plugin/fleet/*
  - '.claude/hooks/repo/*'
  - '.config/repo/oxlint-plugin/*'
autoInstallPeers: true
managePackageManagerVersions: false
pmOnFail: 'warn'
blockExoticSubdeps: true
confirmModulesPurge: false
enablePrePostScripts: true
minimumReleaseAge: 10080
resolutionMode: 'highest'
saveExact: true
trustPolicy: 'no-downgrade'
minimumReleaseAgeExclude:
  - '@sdxgen/*'
  - '@socketoverride/*'
  - '@socketregistry/*'
  - '@socketsecurity/*'
  - '@stuie/*'
  - '@ultrathink/*'
  - 'sdxgen'
  - 'sfw'
  - 'socket'

allowBuilds:
  cpu-features: false
  protobufjs: false
  puppeteer: false
  ssh2: false

patchedDependencies:
  # single-registry (managed by socket-wheelhouse sync; do not edit):
  # routes taze version resolution through its own bundled direct-registry
  # client (getVersionsFromRegistry — full packument, .npmrc/auth-aware) for
  # EVERY registry, instead of the fast-npm-meta hosted endpoint it uses
  # when the registry is the npm default. That third-party hop leaks
  # dependency names, violates the fleet single-registry posture, and is
  # blocked by egress policy — every lookup then hits the request timeout
  # while taze still exits 0 (false green; update.mts fails loud on it).
  # On a taze bump, regenerate via `pnpm patch taze` + `pnpm patch-commit`.
  taze@19.16.0: patches/taze@19.16.0.patch
